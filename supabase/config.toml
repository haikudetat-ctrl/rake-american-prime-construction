# Local development config for `supabase start` (needs Docker).
project_id = "rake-american-prime"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = false

[auth.email]
enable_signup = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
